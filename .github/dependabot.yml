# Dependency update automation (TDD Part 5 §5.2 [MANDATORY] — "Dependency scanning
# (Renovate/Dependabot + audit) + SBOM; pinned versions; minimal deps").
#
# Recorded as missing by the OWASP Mobile review (docs/devops/OWASP_MOBILE_REVIEW.md, M2):
# dependency updates were entirely manual and unprompted. That is the mechanism by which
# react-native-mmkv v2 stayed incompatible with the New Architecture for two milestones —
# nothing surfaced that a newer major existed, and the failure was silent at runtime.
#
# GROUPED, not one PR per package. A single-founder project cannot absorb twenty dependency
# PRs a week; ungrouped Dependabot output gets ignored wholesale, which is worse than none
# because it looks like coverage. Weekly, grouped, with majors separated so a breaking bump
# is never bundled into an otherwise-routine PR.
version: 2

updates:
  - package-ecosystem: npm # covers pnpm workspaces
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch/minor across the workspace: the routine, low-risk stream.
      production-minor:
        applies-to: version-updates
        update-types: ['minor', 'patch']
        patterns: ['*']
    ignore:
      # Expo SDK packages are upgraded together via `expo install --fix`, never individually —
      # a lone expo-* bump against a pinned SDK produces a build that resolves and then fails
      # natively. SDK upgrades stay a deliberate, whole-platform exercise (see the SDK 54
      # re-baseline).
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react-native-*

      # The four below are ALSO pinned by the SDK 54 baseline, and the patterns above miss all
      # four. That gap produced PRs #64, #65 and #75 (2026-07-28), which the tracking docs had
      # queued as one "SDK-upgrade increment" — they are not an increment, they are this rule
      # leaking. Each was checked against the installed peer graph rather than assumed:
      #
      #   @expo/*        `expo-*` does NOT match a scoped `@expo/` name, so the one Expo package
      #                  whose majors track SDK majors slipped through. `@expo/metro-runtime`
      #                  dist-tags map sdk-55→55.x, sdk-56→56.x, latest 57.0.7→SDK 57; this app
      #                  is SDK 54 (the 6.1.x line) and `expo-router@6.0.24` peer-requires
      #                  `^6.1.2`. #64 proposed an SDK 57 package for an SDK 54 app.
      #   @babel/runtime `babel-preset-expo@54.0.12` peer-requires `^7.20.0`; #65 proposed 8.0.0.
      #                  It is also one of the two undeclared-transitive-dependency defects that
      #                  broke bundling during the Execution Gap — it gets extra care, not less.
      #   react          RN 0.81.5's peer is `^19.1.0`, so 19.2.8 is peer-LEGAL and looks safe.
      #   @types/react   It is not: react-native 0.81.5 ships its own Fabric renderer built
      #                  against React "19.1.0" (hardcoded in
      #                  Libraries/Renderer/implementations/ReactFabric-{dev,prod}.js), and
      #                  @testing-library/react-native asserts react-test-renderer === react
      #                  EXACTLY (build/helpers/ensure-peer-deps.js). #75's red CI is that
      #                  assertion — a symptom. Bumping react-test-renderer to match, the
      #                  obvious fix, would turn CI green while leaving the renderer at 19.1.0.
      #                  Every 19.2.x release note is React Server Components: no RN value at all.
      #
      # The asymmetry worth remembering: #64 and #65 passed ALL FIVE CI gates including the
      # bundle gate, while #75 — the peer-legal one — was the only red. Green is not evidence
      # of safety for an SDK-pinned package; `expo export` resolves what fails natively. That is
      # the mmkv-v2 and babel-preset-expo lesson for the third time.
      - dependency-name: react
      - dependency-name: '@types/react'
      - dependency-name: '@expo/*'
      - dependency-name: '@babel/runtime'

      # THIRD LEAK OF THE SAME RULE (2026-08-01), which is the signal that enumerating patterns by
      # hand does not converge. #81 and #63 are both this gap, and neither is a judgement call:
      #
      #   @react-native-community/*   `react-native-*` does not match a SCOPED name, the same way
      #                               `expo-*` did not match `@expo/`. Expo SDK 54's own
      #                               bundledNativeModules.json pins netinfo to EXACTLY the
      #                               installed 11.4.1; #81 proposed 12.0.1. It is also a NATIVE
      #                               module, so `expo export` resolves it while a native build
      #                               would not — the anti-correlation again.
      #   jest-expo                   Pinned by the SDK at ~54.0.17.
      #   jest                        Pinned TRANSITIVELY by jest-expo, which depends on the jest
      #                               29 family (@jest/globals, babel-jest, jest-environment-jsdom,
      #                               jest-snapshot, @jest/create-cache-key-function, all ^29.2.1).
      #                               #63 (jest 29→30) was filed under "red for its own unrelated
      #                               reasons" for two weeks; it is not unrelated, it is this rule.
      #
      # THE AUTHORITATIVE LIST IS NOT THIS FILE. It is
      # `node_modules/expo/bundledNativeModules.json` — every key in it is SDK-pinned by
      # definition. Before adding a pattern here, or triaging any Dependabot PR, check the package
      # against that manifest rather than against its release notes. The one-liner that found both
      # gaps above, and would have found the earlier three:
      #
      #   node -e "const b=require('expo/bundledNativeModules.json'); console.log(b['<pkg>'])"
      #
      # A hit means the package moves only with `expo install --fix`, as part of a deliberate SDK
      # upgrade validated by a native build plus the six Maestro flows.
      - dependency-name: '@react-native-community/*'
      - dependency-name: jest-expo
      - dependency-name: jest
    labels: ['dependencies']

  # The workflows themselves are a supply chain. A compromised or abandoned action runs with
  # whatever the job grants it, and this repo's CI holds deploy credentials.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies', 'ci']
