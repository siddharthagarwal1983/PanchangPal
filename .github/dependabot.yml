# Dependency update automation (TDD Part 5 §5.2 [MANDATORY] — "Dependency scanning
# (Renovate/Dependabot + audit) + SBOM; pinned versions; minimal deps").
#
# Recorded as missing by the OWASP Mobile review (docs/devops/OWASP_MOBILE_REVIEW.md, M2):
# dependency updates were entirely manual and unprompted. That is the mechanism by which
# react-native-mmkv v2 stayed incompatible with the New Architecture for two milestones —
# nothing surfaced that a newer major existed, and the failure was silent at runtime.
#
# GROUPED, not one PR per package. A single-founder project cannot absorb twenty dependency
# PRs a week; ungrouped Dependabot output gets ignored wholesale, which is worse than none
# because it looks like coverage. Weekly, grouped, with majors separated so a breaking bump
# is never bundled into an otherwise-routine PR.
version: 2

updates:
  - package-ecosystem: npm # covers pnpm workspaces
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch/minor across the workspace: the routine, low-risk stream.
      production-minor:
        applies-to: version-updates
        update-types: ['minor', 'patch']
        patterns: ['*']
    ignore:
      # Expo SDK packages are upgraded together via `expo install --fix`, never individually —
      # a lone expo-* bump against a pinned SDK produces a build that resolves and then fails
      # natively. SDK upgrades stay a deliberate, whole-platform exercise (see the SDK 54
      # re-baseline).
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react-native-*

      # The four below are ALSO pinned by the SDK 54 baseline, and the patterns above miss all
      # four. That gap produced PRs #64, #65 and #75 (2026-07-28), which the tracking docs had
      # queued as one "SDK-upgrade increment" — they are not an increment, they are this rule
      # leaking. Each was checked against the installed peer graph rather than assumed:
      #
      #   @expo/*        `expo-*` does NOT match a scoped `@expo/` name, so the one Expo package
      #                  whose majors track SDK majors slipped through. `@expo/metro-runtime`
      #                  dist-tags map sdk-55→55.x, sdk-56→56.x, latest 57.0.7→SDK 57; this app
      #                  is SDK 54 (the 6.1.x line) and `expo-router@6.0.24` peer-requires
      #                  `^6.1.2`. #64 proposed an SDK 57 package for an SDK 54 app.
      #   @babel/runtime `babel-preset-expo@54.0.12` peer-requires `^7.20.0`; #65 proposed 8.0.0.
      #                  It is also one of the two undeclared-transitive-dependency defects that
      #                  broke bundling during the Execution Gap — it gets extra care, not less.
      #   react          RN 0.81.5's peer is `^19.1.0`, so 19.2.8 is peer-LEGAL and looks safe.
      #   @types/react   It is not: react-native 0.81.5 ships its own Fabric renderer built
      #                  against React "19.1.0" (hardcoded in
      #                  Libraries/Renderer/implementations/ReactFabric-{dev,prod}.js), and
      #                  @testing-library/react-native asserts react-test-renderer === react
      #                  EXACTLY (build/helpers/ensure-peer-deps.js). #75's red CI is that
      #                  assertion — a symptom. Bumping react-test-renderer to match, the
      #                  obvious fix, would turn CI green while leaving the renderer at 19.1.0.
      #                  Every 19.2.x release note is React Server Components: no RN value at all.
      #
      # The asymmetry worth remembering: #64 and #65 passed ALL FIVE CI gates including the
      # bundle gate, while #75 — the peer-legal one — was the only red. Green is not evidence
      # of safety for an SDK-pinned package; `expo export` resolves what fails natively. That is
      # the mmkv-v2 and babel-preset-expo lesson for the third time.
      - dependency-name: react
      - dependency-name: '@types/react'
      - dependency-name: '@expo/*'
      - dependency-name: '@babel/runtime'

      # THIRD LEAK OF THE SAME RULE (2026-08-01), which is the signal that enumerating patterns by
      # hand does not converge. #81 and #63 are both this gap, and neither is a judgement call:
      #
      #   @react-native-community/*   `react-native-*` does not match a SCOPED name, the same way
      #                               `expo-*` did not match `@expo/`. Expo SDK 54's own
      #                               bundledNativeModules.json pins netinfo to EXACTLY the
      #                               installed 11.4.1; #81 proposed 12.0.1. It is also a NATIVE
      #                               module, so `expo export` resolves it while a native build
      #                               would not — the anti-correlation again.
      #   jest-expo                   Pinned by the SDK at ~54.0.17.
      #   jest                        Pinned TRANSITIVELY by jest-expo, which depends on the jest
      #                               29 family (@jest/globals, babel-jest, jest-environment-jsdom,
      #                               jest-snapshot, @jest/create-cache-key-function, all ^29.2.1).
      #                               #63 (jest 29→30) was filed under "red for its own unrelated
      #                               reasons" for two weeks; it is not unrelated, it is this rule.
      #
      # THE AUTHORITATIVE LIST IS NOT THIS FILE. It is
      # `node_modules/expo/bundledNativeModules.json` — every key in it is SDK-pinned by
      # definition. Before adding a pattern here, or triaging any Dependabot PR, check the package
      # against that manifest rather than against its release notes. The one-liner that found both
      # gaps above, and would have found the earlier three:
      #
      #   node -e "const b=require('expo/bundledNativeModules.json'); console.log(b['<pkg>'])"
      #
      # A hit means the package moves only with `expo install --fix`, as part of a deliberate SDK
      # upgrade validated by a native build plus the six Maestro flows.
      - dependency-name: '@react-native-community/*'
      - dependency-name: jest-expo
      - dependency-name: jest

      # Same rule, found the same way: Expo SDK 54's version map pins
      # `@sentry/react-native` to ~7.2.0 (`expo/bundledNativeModules.json`), because the package
      # ships native code AND an Expo config plugin that hooks the native build. `expo install
      # --fix` moves it with the SDK; a lone bump is the mmkv-v2 shape again.
      - dependency-name: '@sentry/react-native'

      # FOURTH LEAK (2026-08-02), and it corrects the rule stated above rather than just extending
      # the list. **`bundledNativeModules.json` lists NATIVE modules.** It is authoritative in ONE
      # DIRECTION — a hit means SDK-pinned — and is silent about SDK-pinned *build* packages, which
      # are not native and never appear in it. The claim recorded on 2026-08-01 that scanning it
      # made "the SDK 54 set complete" was therefore wrong, and #89 falsified it within a week.
      #
      # THE CHECK IS TWO-SIDED. Run both before triaging any dependency PR:
      #
      #   node -e "console.log(require('expo/bundledNativeModules.json')['<pkg>'])"   # native
      #   node -e "console.log(require('expo/package.json').dependencies['<pkg>'])"   # build
      #
      # A tilde or caret range in the SECOND is an SDK pin just as much as a hit in the first.
      #
      #   babel-preset-expo  `expo@54.0.36` depends on it as `~54.0.12`, and its majors track SDK
      #                      majors exactly as `@expo/metro-runtime`'s do — #89 proposed 57.0.5,
      #                      an SDK 57 package, for an SDK 54 app. `expo-*` does not match a
      #                      `babel-preset-` prefix, the same miss shape as `@expo/` and
      #                      `@react-native-community/`. Pointedly, this is one of the two
      #                      undeclared transitive dependencies that broke bundling during the
      #                      Execution Gap — the comment above already says it gets extra care.
      #   @babel/core        Pinned by the babel 7 PLUGIN FAMILY the SDK's toolchain is built from,
      #                      not by a declared peer. #92 (7→8) is red because @babel/core 8 is
      #                      ESM-only and every babel-7 plugin `require()`s it:
      #                      `ERR_REQUIRE_ESM ... @babel/plugin-transform-object-rest-spread`, plus
      #                      the bundle gate dying in react-native-worklets' plugin. Same family as
      #                      `@babel/runtime`, and it moves with the SDK for the same reason.
      #   @sentry/cli        `@sentry/react-native@7.2.0` depends on it at EXACTLY "2.55.0" — not a
      #                      range. The top-level `^2.55.0` declaration exists only so
      #                      `sentry.gradle`'s flat-node_modules fallback resolves under pnpm (#79).
      #                      Bumping it to 3.x puts a CLI major at the hoisted path that the SDK was
      #                      never tested against, while the SDK's own nested copy stays 2.55.0.
      #                      It moves with `@sentry/react-native`, which is itself SDK-pinned.
      #
      # #91 IS THE SHARPEST CASE FOR "GREEN IS NOT THE CRITERION" IN THIS FILE: it passed ALL FIVE
      # GATES, and had to, because `e2e.yml` sets `SENTRY_DISABLE_AUTO_UPLOAD: 'true'` and no gate
      # runs `sentry.gradle` at all. The only consumer of @sentry/cli is never exercised in CI, so
      # its green is vacuous rather than reassuring.
      - dependency-name: babel-preset-expo
      - dependency-name: '@babel/core'
      - dependency-name: '@sentry/cli'

      # `@types/node` DESCRIBES THE RUNTIME, so it tracks the runtime FLOOR — not the newest release
      # and not the newest thing the dev machine happens to run. This repo pins
      # `NODE_VERSION: '20.11.0'` in every workflow and declares `engines.node: >=20.11.0`, so the
      # types stay on the 20.x line.
      #
      # #95 proposed 20 → 26 and passed ALL FIVE GATES, which is exactly what you would expect:
      # newer types describe MORE APIs, so nothing fails to compile. That is the defect. It tells
      # the compiler that Node 26 built-ins exist while CI and the declared engine floor are Node
      # 20 — TypeScript stops rejecting code the runtime cannot run, and the failure surfaces at
      # runtime instead of at build. Green here is the symptom, not the reassurance.
      #
      # Worth knowing: `expo@54.0.36` itself depends on `@types/node: ^22.14.0`, resolved nested by
      # pnpm. That is Expo's floor, not ours; ours is set by `engines`. If the engine floor is ever
      # raised, raise these types to match it deliberately — the two move together or not at all.
      - dependency-name: '@types/node'
    labels: ['dependencies']

  # The workflows themselves are a supply chain. A compromised or abandoned action runs with
  # whatever the job grants it, and this repo's CI holds deploy credentials.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    ignore:
      # MAJOR BUMPS ONLY, because this repo pins actions by MAJOR — all nine of them
      # (`actions/checkout@v7`, `pnpm/action-setup@v6`, `actions/setup-java@v5`, …). Publishers
      # move the major tag to each new patch, so `@v5` ALREADY receives 5.x fixes; Dependabot
      # cannot see that and reads `v5` as a version behind `5.6.0`.
      #
      # That produced PR #83 (`setup-java` 5 → 5.6.0), which is not an upgrade at all: it would
      # FREEZE the one action at an exact patch while the other eight keep floating, so it stops
      # receiving the security fixes the moving tag delivers — the opposite of the intent — and
      # leaves the pinning strategy split two ways. `JAVA_VERSION: '17'` is set independently in
      # e2e.yml, so the bump changes no JDK and no behaviour whatsoever.
      #
      # A major bump is the one that genuinely needs a human: it is the case the moving tag does
      # NOT deliver, and the case that breaks inputs.
      #
      # THE COHERENT ALTERNATIVE, deliberately not taken here: pin every action to a full commit
      # SHA, which is what defends against a compromised tag being re-pointed — the threat the
      # comment above names. That is a security-posture decision across all nine actions and all
      # workflows, not a dependency triage, so it is left to the owner rather than smuggled in
      # behind a Dependabot PR.
      - dependency-name: '*'
        update-types:
          ['version-update:semver-patch', 'version-update:semver-minor']
    labels: ['dependencies', 'ci']
