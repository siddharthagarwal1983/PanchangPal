# =============================================================================
# Release build — EAS native build for internal distribution (TDD Part 5 §2.3).
#
# Deliberately NOT part of CD. The build waits for completion, because a job that
# reports success as soon as a build is QUEUED cannot meaningfully fail — that is
# what got the original `eas-build` placeholder removed from cd.yml. Waiting costs
# ~15-20 minutes and one EAS build credit per run, which is too much to spend on
# every merge to main, so it is triggered explicitly instead.
#
# CI's bundle gate (ci.yml → `bundle`) already catches JavaScript-level breakage on
# every PR; this workflow verifies the NATIVE build, which is a different question
# and a far more expensive one to answer.
# =============================================================================

name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '9.6.0'

jobs:
  android:
    name: EAS build (Android) → internal distribution
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails closed on a missing EXPO_ACCESS_TOKEN before any build starts.
      - name: Preflight
        run: bash scripts/preflight.sh staging
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          SUPABASE_STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # Fail fast, and legibly, on a credential problem.
      #
      # scripts/preflight.sh only checks that EXPO_ACCESS_TOKEN is SET — presence, not
      # capability. The v0.1.0 tag run passed preflight, installed dependencies, and then
      # died inside `eas build` with a raw GraphQL error:
      #
      #   Entity not authorized: AppEntity[...] (viewer = RobotViewerContext, action = READ)
      #
      # The token was a robot token without access to this project. Two probes separate the
      # two failure modes that error conflates:
      #
      #   whoami        — is the token valid at all, and who is it?
      #   project:info  — can that identity READ this specific app? This is the exact
      #                   operation that failed, so it reproduces the fault in seconds
      #                   rather than after a dependency install.
      # eas-cli is PINNED (was @latest). Recorded by the OWASP Mobile review as an M2 supply-chain
      # finding: `@latest` resolves at run time, so the tool that builds and SIGNS the release
      # artifact was never the one any previous run used, and a compromised or merely broken
      # publish would land straight in the release path. e2e.yml already made this argument for
      # the Expo CLI ("pnpm exec, NOT pnpm dlx") after a `@latest` fetch broke the config loader;
      # this applies the same rule to the release path. Bumping it is now a visible commit.
      - name: Verify EAS credentials and project access
        working-directory: apps/mobile
        run: |
          set -uo pipefail
          if ! pnpm dlx eas-cli@21.2.0 whoami; then
            echo "::error::EXPO_ACCESS_TOKEN is missing, invalid, or expired — eas-cli could not authenticate."
            exit 1
          fi
          if ! pnpm dlx eas-cli@21.2.0 project:info; then
            echo "::error::Authenticated, but this identity cannot read the EAS project. If the token belongs to a robot user, grant it access to the project (expo.dev -> project -> Access) with at least Developer permission, or use a token from the account that owns the project."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # Source maps (§2.3: "source maps uploaded to Sentry per build").
      #
      # THE UPLOAD IS NOW WIRED. `@sentry/react-native/expo` is in app.config.ts's plugins, so
      # the upload happens inside the EAS build that produced the bundle — the only place Hermes
      # maps correspond to the bytecode they describe. Maps generated by a separate `expo export`
      # belong to a different bundle, and uploading those produces symbolication that is
      # confidently wrong, which is worse than none; that is why B4.3 deliberately left this
      # unwired until the plugin landed rather than adding an upload step here.
      #
      # This step therefore no longer checks whether the MECHANISM exists — it checks whether the
      # CREDENTIALS it needs are present, which is still a real failure mode: the plugin skips the
      # upload silently when SENTRY_AUTH_TOKEN is absent, so without this gate a production build
      # would ship with unsymbolicated crashes and nothing would say so.
      #
      # What this step DOES do is refuse to ship a production build blind. A production release
      # without Sentry configuration has no crash-free measurement (NFR-06, §7.2) and no readable
      # stack traces — the §10.1 go/no-go checks exactly that. Staging warns instead, because
      # there the absence costs visibility rather than the release's only health signal.
      #
      # This is a gate that can fail, not a placeholder: run it with the production profile and no
      # secrets and it exits 1.
      - name: Source-map / crash-reporting readiness
        env:
          PROFILE: ${{ inputs.profile || 'staging' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # if-statements, NOT `[ -z x ] && missing=...`: under `set -e` a test that evaluates
          # FALSE returns non-zero and kills the script, so the all-secrets-present case — the
          # one that must pass — would have failed the step. Caught by running this logic before
          # committing it; a workflow only gets exercised where it is expensive to be wrong.
          missing=""
          if [ -z "${SENTRY_ORG:-}" ]; then missing="$missing SENTRY_ORG"; fi
          if [ -z "${SENTRY_PROJECT:-}" ]; then missing="$missing SENTRY_PROJECT"; fi
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then missing="$missing SENTRY_AUTH_TOKEN"; fi

          if [ -z "$missing" ]; then
            echo "Sentry configuration present; the Expo config plugin will upload source maps from inside this build."
            exit 0
          fi

          if [ "$PROFILE" = "production" ]; then
            echo "::error::Production build blocked: missing$missing. A production release with no crash reporting cannot be measured against NFR-06 (crash-free sessions >= 99.5%), and the §10.1 go/no-go gates on it."
            exit 1
          fi

          echo "::warning::Missing$missing — this $PROFILE build will produce no crash reports and no source maps. Acceptable outside production; see TDD Part 5 §7.1."

      # ANDROID ONLY. iOS signing needs an Apple Developer membership that does not exist
      # yet, so `--platform all` would fail on the iOS half of every run. Add `ios` once
      # the membership and credentials are in place (B3 remainder).
      #
      # EXPO_PUBLIC_* are not passed here: they live in the EAS "preview" environment,
      # which apps/mobile/eas.json binds to the staging profile.
      #
      # No `--no-wait`: the wait IS the verification. If this becomes too slow, narrow the
      # trigger further — do not make the job stop checking.
      - name: EAS build
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@21.2.0 build --platform android --profile "${{ inputs.profile || 'staging' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### EAS Android build (${{ inputs.profile || 'staging' }}): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: https://expo.dev/accounts/siddharth2008/projects/panchangpal/builds" >> "$GITHUB_STEP_SUMMARY"
