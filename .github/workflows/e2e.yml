# =============================================================================
# E2E — Maestro FLOW_* against a real Android build (TDD Part 5 §2.2, B2).
#
# Replaces the `e2e-staging` placeholder removed from cd.yml, which ran
# `echo "maestro test tests/flows"` and reported success on every push while
# tests/flows/ held nothing but .gitkeep.
#
# THE APK IS BUILT HERE, NOT PULLED FROM EAS. An E2E gate answers "does THIS change
# behave correctly", and that only means something if the binary contains the change.
# Installing the latest EAS artifact would test whichever commit was last built — green
# would mean "some earlier commit worked", which is the exact class of comfortable-but-
# false signal this milestone exists to remove. The shippable EAS artifact is verified
# separately by release-build.yml; these are two different questions.
#
# The trade-off is honest: a CI build is signed with a throwaway debug keystore and is
# not byte-identical to the release artifact, so release-only faults (minification,
# signing-dependent integrations) are out of scope here and covered by release-build.yml.
#
# Runs on push to main and on demand rather than per-PR: emulator boot plus a native
# build is ~15-20 minutes. ci.yml's bundle gate already catches build breakage on every
# PR in about a minute. If per-PR E2E becomes worth the wall-clock, widen the trigger —
# but do not make the job stop waiting for the flows.
# =============================================================================

name: E2E (Maestro)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress is FALSE, deliberately. This job takes ~20-40 minutes, so on a branch
# receiving several merges in an afternoon, cancelling the in-flight run means the gate reports
# nothing at all — and a cancelled run is not a red run, so nobody is told. That is exactly what
# happened between 2026-07-19 and 2026-07-22: six consecutive runs were cancelled by this
# setting, hiding that the Android build had outgrown its timeout when expo-updates landed. The
# gate looked untouched rather than broken. Queueing costs runner minutes; cancelling costs the
# signal the job exists to produce.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '9.6.0'
  JAVA_VERSION: '17'

jobs:
  android-e2e:
    name: FLOW_* on Android
    runs-on: ubuntu-latest
    # 90, raised from 45. The 45 was calibrated against a 19-minute Android build on
    # 2026-07-19; adding expo-updates (PR #24) brought Kotlin/KSP compilation into the graph and
    # pushed it past 41 minutes, so the job was killed mid-build and reported `cancelled`. The
    # Gradle cache below should bring it back down — the headroom is so a slow cold build fails
    # on its merits rather than on the clock.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      # Gradle needs a JDK; Expo SDK 54 / RN 0.81 build against 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '${{ env.JAVA_VERSION }}'

      # The Android build was uncached: every run re-resolved and recompiled the whole native
      # dependency graph. That was tolerable at 19 minutes and is not at 40+. Keyed on the
      # lockfile and the mobile manifest, since those are what change the native graph; the
      # restore-key means an unrelated dependency bump still starts from a warm cache.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # EXPO_PUBLIC_* are baked into the JS bundle at build time and must match what the
      # flows expect — they assert seeded staging content. EAS's "preview" environment is
      # the single source of truth (apps/mobile/eas.json binds it to the staging profile),
      # so pull from there rather than duplicating the values into GitHub secrets.
      - name: Pull staging config from EAS
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@21.2.0 env:pull --environment preview --path .env --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ⚠️ WITHOUT THIS, CI REPORTS ITSELF AS PRODUCTION. The step above pulls a REAL
      # EXPO_PUBLIC_SENTRY_DSN, so these emulator launches reach Sentry; and `sentryEnvironment()`
      # derived the environment from `extra.eas.channel`, which only EAS Build stamps. This job
      # builds with `expo prebuild` + `gradlew assembleRelease` on the runner, so there is no
      # channel, and `__DEV__` is false in a release APK — the fallback resolved to 'production'.
      #
      # Found 2026-08-02, after the dashboard showed 91 sessions at "100% crash-free" that were
      # essentially all E2E launches. An alert scoped to `environment:production` — the scope §7.2
      # wants — would have paged on every CI run, and the crash-free SLO would have been measuring
      # an emulator instead of users.
      #
      # Appended rather than set in `env:`, because `env:pull` OVERWRITES .env wholesale and the
      # bundler reads the file, not the shell.
      #
      # ⚠️ THE LEADING NEWLINE IS LOAD-BEARING, and omitting it broke the suite once (run
      # 30735155676, 4/6 failed against main's 6/6). `eas env:pull` does not guarantee a trailing
      # newline, so a bare `echo ... >> .env` concatenates onto the LAST VARIABLE'S VALUE: the
      # name still parses, so the file looks fine, while that variable now holds
      # `<real value>EXPO_PUBLIC_SENTRY_ENVIRONMENT=ci`. A corrupted EXPO_PUBLIC_SUPABASE_URL
      # fails every backend call, and the four flows that need one fail while the two that do not
      # pass — which reads as a product defect rather than a workflow bug.
      #
      # The tell is in this job's own log: `env: export ...` lists the parsed names. If
      # EXPO_PUBLIC_SENTRY_ENVIRONMENT is absent from that line, this step silently did the wrong
      # thing. Check it before believing a green.
      - name: Tag this build's telemetry as CI, not production
        working-directory: apps/mobile
        run: printf '\nEXPO_PUBLIC_SENTRY_ENVIRONMENT=ci\n' >> .env

      # Generates the native android/ project. Not committed — the app is a managed
      # Expo project, so this is regenerated per run and stays disposable.
      # `pnpm exec`, NOT `pnpm dlx`. dlx fetches the LATEST expo CLI (57.x), whose config
      # loader cannot parse this project's TypeScript app.config.ts:
      #   SyntaxError: Error reading Expo config at app.config.ts: Unexpected token '{'
      # exec uses the project's own Expo 54. Found by running this locally first.
      - name: Prebuild native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # assembleRelease, not assembleDebug: a debug APK expects a Metro server at runtime,
      # whereas release bundles the JS into the APK. The React Native template signs the
      # release variant with the debug keystore when no release signing config is present,
      # which is fine for an emulator and deliberately NOT how the shipped artifact is
      # signed (that is EAS, with the real keystore).
      # ONE ABI, not four. gradle.properties ships armeabi-v7a + arm64-v8a + x86 + x86_64
      # because a shipped build needs them all; the emulator below is x86_64 and can only ever
      # run one, so the other three are compiled and discarded. That waste is what pushed this
      # job past its timeout once expo-updates added Kotlin/KSP work on top.
      #
      # Safe precisely because this APK is not the shippable one — it is signed with a throwaway
      # debug keystore and exists to answer "does this change behave correctly" (see the header).
      # release-build.yml builds the real artifact, with every ABI.
      - name: Build APK
        working-directory: apps/mobile/android
        # FAIL FAST, LOUD. Run 29949921351 proved the danger: assembleRelease failed at ~11 min, then
        # Gradle sat on stuck workers for ~80 min until timeout-minutes killed the whole job and it
        # reported `cancelled` — a red build wearing a timeout's costume, the exact "gate goes dark"
        # failure this milestone exists to remove. `timeout` caps a stuck build so it surfaces as a
        # red STEP in minutes (--kill-after force-reaps lingering no-daemon workers); --stacktrace
        # prints the real failure the killed run never got to emit. 40m is generous headroom over a
        # cold single-ABI native compile and still leaves the emulator + flows room under the 90m job.
        #
        # TRIM to what an emulator FLOW_* run needs. This APK is the throwaway debug-signed one (see
        # header) — never shipped, so release-only work is dead weight and, worse, was the failure:
        #   lintVitalRelease / lintVitalAnalyzeRelease — release lint; release-build.yml owns that gate.
        #   mergeReleaseNativeDebugMetadata — crash-symbolication metadata bundled into the AAB, unused
        #     by an APK, and the task that actually FAILED under the single-ABI build.
        #
        # SENTRY_DISABLE_AUTO_UPLOAD: the Sentry config plugin adds a source-map upload task to every
        # release build, and that task FAILS the build when it cannot run — it does not skip. There
        # are no Sentry credentials here and an emulator throwaway APK has nothing worth
        # symbolicating, so the upload is switched off explicitly (sentry.gradle gates it with
        # `onlyIf`). Found the hard way: the first native build after adding the plugin died on
        # `:app:createBundleReleaseJsAndAssets_SentryUpload_*`. release-build.yml keeps its own
        # credential gate and does NOT set this, because a shipped build must upload its maps.
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          timeout --kill-after=2m 40m ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=x86_64 \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -x mergeReleaseNativeDebugMetadata

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM is required for a usable emulator; GitHub's Linux runners provide it but the
      # device is not world-accessible by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # x86_64, because the runner is x86_64 — the arm64 image used on an Apple Silicon
      # workstation would be emulated here and unusably slow.
      #
      # `default` (AOSP), not `google_apis`. The google_apis image ships Pixel Launcher and the
      # Google app, and those — not our app — are what has now failed the gate twice: every
      # captured hierarchy in run 30170796356 showed "Pixel Launcher isn't responding" covering
      # the screen while logcat showed our app running normally. They are also the source of the
      # DiscoverPrecheckException noise in every log we have. `hide_error_dialogs` (below) held
      # for three green runs and then stopped being sufficient; removing the processes that ANR
      # is the durable fix, where suppressing their dialogs was a patch on the symptom.
      #
      # Nothing we test needs Play Services: `expo-notifications` is not installed (M7 ships a
      # NullNotificationAdapter), there is no Maps or Play Billing dependency, and
      # `react-native-purchases` is likewise deferred. If a future slice installs one of those,
      # this must go back to google_apis — and then the ANR problem returns with it.
      - name: Run FLOW_* on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # logcat is captured unconditionally and the flows' exit status is preserved.
          # Screenshots show that a flow failed; only the device log says WHY when the cause is
          # a silent runtime degradation. FLOW_SESSION_PERSISTENCE depends on this directly: the
          # '[ritual] Persistent storage unavailable' warning is what distinguishes "MMKV fell
          # back to memory" from "MMKV was active and the session was never persisted", and those
          # two produce an identical screenshot.
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            # Suppress system "isn't responding" (ANR) dialogs.
            #
            # Twice now a run has failed 3/3 flows with the app itself healthy: a "Pixel Launcher
            # isn't responding" dialog from the emulator's own Google apps covered the screen, and
            # Maestro asserted against the dialog. Logcat both times showed the app running
            # normally ("Running \"main\"", ExpoModulesCore initialized) — a false red, which is as
            # corrosive to a gate's credibility as a false green.
            #
            # This hides the OS dialog only; it does not make an unresponsive app pass. If OUR app
            # hangs, the flow still fails on its own assertions, which is the signal we want.
            #
            # Kept as a second layer after the move to the AOSP image (see `target:` above), which
            # removes the processes that were ANRing. A third occurrence would mean the cause is
            # something other than the Google apps, and this line must not be what obscures it.
            adb shell settings put global hide_error_dialogs 1
            adb logcat -c
            # A HUNG FLOW MUST FAIL RED, NOT GO DARK — see scripts/run-maestro-flows.sh, which
            # runs the suite under a wall-clock budget, annotates a hang distinctly from a flow
            # failure, captures logcat unconditionally, and re-raises the suite's exit status.
            #
            # ⚠️ THIS MUST STAY ONE LINE, AND THE LOGIC MUST STAY IN THE SCRIPT. This `script:`
            # block is executed ONE LINE AT A TIME, each in its own `sh -c`, so a multi-line
            # `if`/`then`/`fi` here is a syntax error and a variable assigned on one line is gone
            # by the next. An earlier inline version of this guard failed the step with exit 2 on
            # a run where all 6 flows PASSED, and skipped the logcat dump on every red run.
            # The script's header records the evidence.
            bash scripts/run-maestro-flows.sh tests/flows/

      # Maestro writes screenshots and a view hierarchy per failed step. Without these a
      # remote failure is nearly undiagnosable — the whole point of these flows is that
      # they catch things which only look wrong.
      # always(), not failure(): a PASSING persistence run is itself the evidence that the
      # session survived, and the screenshots are what make that claim checkable by a human
      # later rather than trusted because a job was green.
      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests
            maestro-logcat.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### E2E (Maestro): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          # Derived from the directory `maestro test tests/flows/` actually runs, never hand-listed.
          # The hardcoded list this replaces said four flows for the whole time five were running:
          # FLOW_AUTH_SESSION_PERSISTENCE arrived with B6 and nobody remembered the echo. A summary
          # that under-reports coverage is a small lie that the tracking docs then repeat — which is
          # exactly what happened, until the count was corrected on 2026-07-26.
          count=$(find tests/flows -name 'FLOW_*.yaml' | wc -l | tr -d ' ')
          # `paste -sd', '` would NOT work here: -d takes a list of delimiters used cyclically, so
          # it alternates "," and " " between entries rather than joining with ", ".
          names=$(find tests/flows -name 'FLOW_*.yaml' -exec basename {} .yaml \; | sort | paste -sd, - | sed 's/,/, /g')
          echo "Flows (${count}): ${names}" >> "$GITHUB_STEP_SUMMARY"
