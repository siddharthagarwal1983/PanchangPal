# =============================================================================
# OTA — Expo Updates (TDD Part 5 §2.4 [MANDATORY], §3.4, ADR-024). JS-only,
# store-policy-compliant changes ship to Expo Updates channels for fast fixes. NO
# native-module / config-plugin changes via OTA (TRISK-10). Manual dispatch so an OTA is
# a deliberate action, not every merge.
#
# B7.1 (2026-08-07) — THE PUBLISH STEP IS REAL. It was an `echo` until 2026-07-19, which
# reported SUCCESS while shipping nothing; then a deliberate `exit 1` so a dispatch could
# not be mistaken for a release. It now runs `eas update`, and adds the rollback half
# §3.4's flowchart requires ("JS/OTA → roll back OTA to prior update").
#
# ⚠️ §2.4's "no native changes over OTA" rule is enforced MECHANICALLY, not by discipline:
# `app.config.ts` sets `runtimeVersion: { policy: 'fingerprint' }`, so an update built
# against different native dependencies gets a different fingerprint and is simply not
# delivered to existing builds. That is the protection — and it is also the trap this
# workflow guards below, because the same mechanism means a perfectly successful publish
# can reach NOBODY without saying so.
# =============================================================================
name: OTA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Expo Updates channel'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      action:
        description: 'publish a new update, or roll back the latest one'
        required: true
        default: 'publish'
        type: choice
        options: [publish, rollback]
      confirm_production:
        description: "Type PUBLISH TO PRODUCTION to allow a production OTA (ignored for staging)"
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '9.6.0'
  # Pinned, per §5.2 supply-chain controls and to match e2e.yml / release-build.yml. A
  # floating `@latest` here would change what ships to users without a repository change.
  EAS_CLI_VERSION: '21.2.0'

jobs:
  publish-ota:
    name: '${{ inputs.action }} → ${{ inputs.channel }}'
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      # PRODUCTION IS GUARDED BY AN EXPLICIT TYPED CONFIRMATION.
      #
      # An OTA to `production` reaches every installed build with a matching runtime version
      # immediately, with no store review in front of it — which is exactly why §2.4 wants it
      # available, and exactly why it should not be one mis-click from a dropdown. §3.2 requires
      # rollouts to be STAGED (internal → beta → phased) with monitoring between stages; that
      # staging cannot be expressed here yet (it needs a store presence), so the interim control
      # is a deliberate action rather than an implied one. Staging needs no confirmation: it is
      # internal distribution.
      - name: Confirm a production OTA
        if: inputs.channel == 'production'
        run: |
          if [ "${{ inputs.confirm_production }}" != "PUBLISH TO PRODUCTION" ]; then
            echo "::error::Refusing a production OTA. Re-dispatch with confirm_production set to the exact phrase PUBLISH TO PRODUCTION."
            exit 1
          fi
          echo "Production OTA confirmed by explicit input."

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      # `eas update` RUNS THE BUNDLER — it is not an API call. Without the workspace installed
      # it cannot resolve the app's imports, so this is a real dependency of the publish step
      # rather than boilerplate copied from the other workflows.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Preflight (fail fast on missing config)
        working-directory: .
        run: bash scripts/preflight.sh "${{ inputs.channel }}"
        env:
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # Same probe as release-build.yml: an unauthorized or expired token is reported in seconds
      # here, rather than after a dependency install and a bundle, with an error that names the
      # cause instead of looking like a project fault.
      - name: Probe EAS credentials
        run: |
          if ! pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} whoami; then
            echo "::error::EXPO_ACCESS_TOKEN is missing or not authorized. Nothing was published."
            exit 1
          fi
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} project:info
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ---------------------------------------------------------------------------------
      # PUBLISH
      # ---------------------------------------------------------------------------------
      - name: Publish update
        if: inputs.action == 'publish'
        id: publish
        run: |
          set -o pipefail
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} update \
            --channel "${{ inputs.channel }}" \
            --message "OTA ${GITHUB_SHA::7} via ${GITHUB_WORKFLOW}#${GITHUB_RUN_NUMBER}" \
            --non-interactive --json | tee update.json
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("update.json", "utf8"));
            // `eas update --json` returns an array with one entry per platform; they share a
            // group id and runtime version.
            const list = Array.isArray(raw) ? raw : [raw];
            const first = list[0] || {};
            const out = [
              ["group", first.group || ""],
              ["runtimeVersion", first.runtimeVersion || ""],
              ["branch", (first.branch && first.branch.name) || first.branchName || ""],
              ["platforms", list.map((u) => u.platform).filter(Boolean).join(",")],
            ];
            for (const [k, v] of out) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
          '
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ⚠️ A SUCCESSFUL PUBLISH CAN REACH NOBODY, AND NOTHING ELSE WOULD SAY SO.
      #
      # `runtimeVersion: fingerprint` means an update is delivered only to builds whose native
      # fingerprint matches. That is what enforces §2.4 — and it also means that if the native
      # graph has moved since the last build, the publish succeeds, the dashboard shows a new
      # update, and **no installed app will ever receive it**. This repo has paid three times for
      # reading a green that no gate could have failed; an OTA that ships to an empty audience is
      # the same shape, and the only way to see it is to ask how many builds carry this runtime
      # version.
      #
      # A WARNING rather than a failure, deliberately: with no EAS build yet published for a
      # channel the count is legitimately zero, and a step that always fails would be the
      # placeholder shape B1 spent its time removing. It is loud, and it names the fix.
      - name: Who will actually receive this update?
        if: inputs.action == 'publish'
        run: |
          RV='${{ steps.publish.outputs.runtimeVersion }}'
          echo "Update group : ${{ steps.publish.outputs.group }}"
          echo "Runtime ver. : ${RV}"
          echo "Channel      : ${{ inputs.channel }}"
          COUNT=$(pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} build:list \
                    --channel "${{ inputs.channel }}" \
                    --runtime-version "${RV}" \
                    --status finished --limit 20 --json --non-interactive \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);console.log(Array.isArray(a)?a.length:0)}catch{console.log(0)}})')
          echo "Finished builds on this channel with a matching runtime version: ${COUNT}"
          {
            echo "### OTA ${{ inputs.action }} → ${{ inputs.channel }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Update group | \`${{ steps.publish.outputs.group }}\` |"
            echo "| Runtime version | \`${RV}\` |"
            echo "| Branch | \`${{ steps.publish.outputs.branch }}\` |"
            echo "| Platforms | ${{ steps.publish.outputs.platforms }} |"
            echo "| Matching finished builds | **${COUNT}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT}" = "0" ]; then
            echo "::warning::This update reaches NO existing build. Its runtime version (${RV}) matches no finished build on channel '${{ inputs.channel }}', so no installed app will receive it. That is expected before the channel's first EAS build; after one exists it means the native fingerprint has moved and a new build is required (TDD §2.4)."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ **This update reaches no existing build.** Expected before the channel's first EAS build; otherwise the native fingerprint has moved and a new store build is required." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ---------------------------------------------------------------------------------
      # ROLLBACK — §3.4's "JS/OTA → roll back OTA to prior update"
      # ---------------------------------------------------------------------------------
      # `eas update:rollback` REQUIRES an explicit GROUPID in non-interactive mode, and it must be
      # the LATEST group for its branch and runtime version. So the group is resolved here rather
      # than typed by an operator mid-incident — which is the moment least suited to looking up an
      # id. Republishing the previous update is what the command does; if there is no previous
      # update it rolls back to the embedded one, which is the correct terminal behaviour.
      - name: Resolve the channel's latest update group
        if: inputs.action == 'rollback'
        id: resolve
        run: |
          set -o pipefail
          BRANCH=$(pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} channel:view "${{ inputs.channel }}" --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const c=JSON.parse(s);const b=(c.updateBranches||c.branches||[])[0];console.log((b&&b.name)||"")}catch{console.log("")}})')
          if [ -z "$BRANCH" ]; then
            echo "::error::Could not resolve a branch for channel '${{ inputs.channel }}'. Nothing was rolled back."
            exit 1
          fi
          GROUP=$(pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} update:list --branch "$BRANCH" --limit 1 --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const g=(a.currentPage||a)[0];console.log((g&&(g.group||g.id))||"")}catch{console.log("")}})')
          if [ -z "$GROUP" ]; then
            echo "::error::Channel '${{ inputs.channel }}' (branch '$BRANCH') has no update to roll back. Nothing was changed."
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "group=$GROUP"   >> "$GITHUB_OUTPUT"
          echo "Will roll back branch '$BRANCH', update group '$GROUP'."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Roll back
        if: inputs.action == 'rollback'
        run: |
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} update:rollback "${{ steps.resolve.outputs.group }}" \
            --message "Rollback of ${{ steps.resolve.outputs.group }} via ${GITHUB_WORKFLOW}#${GITHUB_RUN_NUMBER}" \
            --non-interactive
          {
            echo "### OTA rollback → ${{ inputs.channel }}"
            echo ""
            echo "Rolled back branch \`${{ steps.resolve.outputs.branch }}\`, group \`${{ steps.resolve.outputs.group }}\`."
            echo ""
            echo "> Verify metrics recover before closing the incident, then hold a blameless postmortem (TDD §3.4)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
