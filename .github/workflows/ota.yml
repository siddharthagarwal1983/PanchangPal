# =============================================================================
# OTA — Expo Updates (TDD Part 5 §2.4 [MANDATORY], §3.4, ADR-024). JS-only,
# store-policy-compliant changes ship to Expo Updates channels for fast fixes. NO
# native-module / config-plugin changes via OTA (TRISK-10). Manual dispatch so an OTA is
# a deliberate action, not every merge.
#
# B7.1 (2026-08-07) — THE PUBLISH STEP IS REAL. It was an `echo` until 2026-07-19, which
# reported SUCCESS while shipping nothing; then a deliberate `exit 1` so a dispatch could
# not be mistaken for a release. It now runs `eas update`, and adds the rollback half
# §3.4's flowchart requires ("JS/OTA → roll back OTA to prior update").
#
# ⚠️ §2.4's "no native changes over OTA" rule is enforced MECHANICALLY, not by discipline:
# `app.config.ts` sets `runtimeVersion: { policy: 'fingerprint' }`, so an update built
# against different native dependencies gets a different fingerprint and is simply not
# delivered to existing builds. That is the protection — and it is also the trap this
# workflow guards below, because the same mechanism means a perfectly successful publish
# can reach NOBODY without saying so.
# =============================================================================
name: OTA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Expo Updates channel'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      action:
        description: 'publish, roll back, or drive a staged rollout (§3.2)'
        required: true
        default: 'publish'
        type: choice
        options: [publish, rollback, rollout-start, rollout-advance, rollout-end, rollout-view]
      branch:
        description: 'Candidate branch. Publish targets it; rollout-start rolls the channel out to it. Defaults to the channel name.'
        required: false
        default: ''
        type: string
      percent:
        description: 'Percent of users on the candidate branch (rollout-start / rollout-advance). §3.2 suggests 10 → 50 → 100.'
        required: false
        default: '10'
        type: string
      rollout_outcome:
        description: 'How rollout-end finishes: revert abandons the candidate (the crash-spike action); republish-and-revert keeps it.'
        required: false
        default: 'revert'
        type: choice
        options: [revert, republish-and-revert]
      confirm_production:
        description: "Type PUBLISH TO PRODUCTION to allow a production OTA (ignored for staging)"
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '9.6.0'
  # Pinned, per §5.2 supply-chain controls and to match e2e.yml / release-build.yml. A
  # floating `@latest` here would change what ships to users without a repository change.
  EAS_CLI_VERSION: '21.2.0'

jobs:
  publish-ota:
    name: '${{ inputs.action }} → ${{ inputs.channel }}'
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      # PRODUCTION IS GUARDED BY AN EXPLICIT TYPED CONFIRMATION.
      #
      # An OTA to `production` reaches every installed build with a matching runtime version
      # immediately, with no store review in front of it — which is exactly why §2.4 wants it
      # available, and exactly why it should not be one mis-click from a dropdown. §3.2 requires
      # rollouts to be STAGED (internal → beta → phased) with monitoring between stages; that
      # staging cannot be expressed here yet (it needs a store presence), so the interim control
      # is a deliberate action rather than an implied one. Staging needs no confirmation: it is
      # internal distribution.
      - name: Confirm a production OTA
        if: inputs.channel == 'production'
        run: |
          if [ "${{ inputs.confirm_production }}" != "PUBLISH TO PRODUCTION" ]; then
            echo "::error::Refusing a production OTA. Re-dispatch with confirm_production set to the exact phrase PUBLISH TO PRODUCTION."
            exit 1
          fi
          echo "Production OTA confirmed by explicit input."

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      # `eas update` RUNS THE BUNDLER — it is not an API call. Without the workspace installed
      # it cannot resolve the app's imports, so this is a real dependency of the publish step
      # rather than boilerplate copied from the other workflows.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # ⚠️ THE SUPABASE SECRETS ARE PREFLIGHT'S CONTRACT, NOT AN OTA DEPENDENCY.
      #
      # `preflight.sh <target>` answers "is this ENVIRONMENT fully configured", so its staging and
      # production targets require the Supabase DB URL, project ref and access token. Publishing a
      # JS bundle needs none of them — but the check is environment-shaped, and `release-build.yml`
      # maps exactly the same four for exactly the same call. Consistency with that sibling beats a
      # narrower `ota` target invented here (CLAUDE.md decision rule 5).
      #
      # This mapping is also the reason the OLD scaffold's failure message was UNREACHABLE. It
      # passed only EXPO_ACCESS_TOKEN, so preflight died on SUPABASE_STAGING_DB_URL before the
      # workflow reached its own `exit 1` — and its comment, "Preflight passed, so the channel's
      # configuration is present", could never have been printed. Nobody noticed because nobody
      # dispatched it. Found by running this for the first time on 2026-08-07.
      - name: Preflight (fail fast on missing config)
        working-directory: .
        run: bash scripts/preflight.sh "${{ inputs.channel }}"
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          SUPABASE_STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # Same probe as release-build.yml: an unauthorized or expired token is reported in seconds
      # here, rather than after a dependency install and a bundle, with an error that names the
      # cause instead of looking like a project fault.
      - name: Probe EAS credentials
        run: |
          if ! pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} whoami; then
            echo "::error::EXPO_ACCESS_TOKEN is missing or not authorized. Nothing was published."
            exit 1
          fi
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} project:info
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ---------------------------------------------------------------------------------
      # PUBLISH
      # ---------------------------------------------------------------------------------
      # `--branch` when one is given, `--channel` otherwise.
      #
      # A STAGED ROLLOUT SPLITS TRAFFIC BETWEEN TWO BRANCHES, which is why the branch input exists.
      # `eas update --channel X` publishes onto a branch named X and points the channel at it — fine
      # for a straight release, but there is then nothing to roll *toward*. To stage a rollout
      # (§3.2), publish the candidate to its own branch first, then `rollout-start` moves a
      # percentage of the channel's traffic onto it while everyone else stays on the old one.
      - name: Publish update
        if: inputs.action == 'publish'
        id: publish
        run: |
          set -o pipefail
          TARGET_ARGS="--channel ${{ inputs.channel }}"
          if [ -n "${{ inputs.branch }}" ]; then TARGET_ARGS="--branch ${{ inputs.branch }}"; fi
          echo "Publishing with: ${TARGET_ARGS}"
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} update \
            ${TARGET_ARGS} \
            --message "OTA ${GITHUB_SHA::7} via ${GITHUB_WORKFLOW}#${GITHUB_RUN_NUMBER}" \
            --non-interactive --json | tee update.json
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("update.json", "utf8"));
            // `eas update --json` returns an array with one entry per platform; they share a
            // group id and runtime version.
            const list = Array.isArray(raw) ? raw : [raw];
            const first = list[0] || {};
            // The KEY NAMES ARE PRINTED, not assumed. The first version of this step guessed
            // `branch.name` / `branchName` from --help and got the group and runtime version right
            // while silently extracting an EMPTY branch — a parser that half-works and reports
            // success. Printing the shape means the next mismatch is diagnosable from the log
            // instead of costing another dispatch.
            console.log("update.json keys:", JSON.stringify(Object.keys(first)));
            const branch =
              (first.branch && first.branch.name) ||
              first.branchName ||
              (first.updateBranch && first.updateBranch.name) ||
              first.branch ||
              "";
            const out = [
              ["group", first.group || ""],
              ["runtimeVersion", first.runtimeVersion || ""],
              ["branch", typeof branch === "string" ? branch : ""],
              ["platforms", list.map((u) => u.platform).filter(Boolean).join(",")],
            ];
            for (const [k, v] of out) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
            for (const [k, v] of out) console.log(`${k} = ${v || "(empty)"}`);
          '
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ⚠️ A SUCCESSFUL PUBLISH CAN REACH NOBODY, AND NOTHING ELSE WOULD SAY SO.
      #
      # `runtimeVersion: fingerprint` means an update is delivered only to builds whose native
      # fingerprint matches. That is what enforces §2.4 — and it also means that if the native
      # graph has moved since the last build, the publish succeeds, the dashboard shows a new
      # update, and **no installed app will ever receive it**. This repo has paid three times for
      # reading a green that no gate could have failed; an OTA that ships to an empty audience is
      # the same shape, and the only way to see it is to ask how many builds carry this runtime
      # version.
      #
      # A WARNING rather than a failure, deliberately: with no EAS build yet published for a
      # channel the count is legitimately zero, and a step that always fails would be the
      # placeholder shape B1 spent its time removing. It is loud, and it names the fix.
      - name: Who will actually receive this update?
        if: inputs.action == 'publish'
        run: |
          RV='${{ steps.publish.outputs.runtimeVersion }}'
          echo "Update group : ${{ steps.publish.outputs.group }}"
          echo "Runtime ver. : ${RV}"
          echo "Channel      : ${{ inputs.channel }}"
          COUNT=$(pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} build:list \
                    --channel "${{ inputs.channel }}" \
                    --runtime-version "${RV}" \
                    --status finished --limit 20 --json --non-interactive \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);console.log(Array.isArray(a)?a.length:0)}catch{console.log(0)}})')
          echo "Finished builds on this channel with a matching runtime version: ${COUNT}"
          {
            echo "### OTA ${{ inputs.action }} → ${{ inputs.channel }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Update group | \`${{ steps.publish.outputs.group }}\` |"
            echo "| Runtime version | \`${RV}\` |"
            echo "| Branch | \`${{ steps.publish.outputs.branch }}\` |"
            echo "| Platforms | ${{ steps.publish.outputs.platforms }} |"
            echo "| Matching finished builds | **${COUNT}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT}" = "0" ]; then
            echo "::warning::This update reaches NO existing build. Its runtime version (${RV}) matches no finished build on channel '${{ inputs.channel }}', so no installed app will receive it. That is expected before the channel's first EAS build; after one exists it means the native fingerprint has moved and a new build is required (TDD §2.4)."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ **This update reaches no existing build.** Expected before the channel's first EAS build; otherwise the native fingerprint has moved and a new store build is required." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ---------------------------------------------------------------------------------
      # ROLLBACK — §3.4's "JS/OTA → roll back OTA to prior update"
      # ---------------------------------------------------------------------------------
      # `eas update:rollback` REQUIRES an explicit GROUPID in non-interactive mode, and it must be
      # the LATEST group for its branch and runtime version. So the group is resolved here rather
      # than typed by an operator mid-incident — which is the moment least suited to looking up an
      # id. Republishing the previous update is what the command does; if there is no previous
      # update it rolls back to the embedded one, which is the correct terminal behaviour.
      - name: Resolve the channel's latest update group
        if: inputs.action == 'rollback'
        id: resolve
        run: |
          set -o pipefail
          # THE BRANCH IS THE CHANNEL'S OWN NAME, BY CONSTRUCTION — not by inference.
          #
          # Every update here is published with `eas update --channel X`, which creates a branch
          # named X and points the channel at it. `update:list --branch X` below then PROVES the
          # branch is real: if it did not exist, or held no updates, the step fails with a clear
          # message rather than rolling back something else.
          #
          # An earlier version parsed `eas channel:view --json` to discover the branch. Three
          # successive shape guesses missed — the real payload is `{ currentPage: [...] }` whose
          # entries carry neither `name` nor `branchName` at the top level — so a healthy rollback
          # always emitted a "could not resolve a branch" warning. **A warning that fires every time
          # is one operators learn to ignore**, which is the alert-fatigue failure §7 already cost
          # this project. Deleting the parse removes both the fragility and the noise; nothing
          # downstream needed it.
          #
          # ⚠️ LIMIT, STATED: this assumes a channel maps to a single same-named branch. That holds
          # for every update this repo publishes. If §3.2's staged rollout is ever configured with a
          # channel pointing at TWO branches (a canary split), this resolution must be revisited —
          # it would pick the channel-named one and roll back only that side.
          BRANCH="${{ inputs.channel }}"
          echo "Branch (by channel convention): ${BRANCH}"
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} update:list --branch "$BRANCH" --limit 1 --json --non-interactive > updates.json 2>updates.err || true
          GROUP=$(node -e '
            const fs=require("fs");
            let a={}; try { a = JSON.parse(fs.readFileSync("updates.json","utf8")) } catch {}
            console.error("updates.json shape:", Array.isArray(a) ? "array" : JSON.stringify(Object.keys(a)));
            const rows = a.currentPage || a.updates || (Array.isArray(a) ? a : []);
            const g = rows[0];
            process.stdout.write((g && (g.group || g.updateGroup || g.id)) || "");
          ')
          if [ -z "$GROUP" ]; then
            echo "::error::Branch '$BRANCH' has no update to roll back (or does not exist). Nothing was changed. This is also the check that proves the channel-to-branch convention held."
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "group=$GROUP"   >> "$GITHUB_OUTPUT"
          echo "Will roll back branch '$BRANCH', update group '$GROUP'."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # ---------------------------------------------------------------------------------
      # STAGED ROLLOUT — §3.2 [MANDATORY], and §2.4's "rollouts are staged and monitored
      # (Sentry crash-free), auto-rollback on a crash spike".
      #
      # §3.2 requires internal → beta/canary → phased (10% → 50% → 100%) with crash-free,
      # error-rate and key-funnel monitoring BETWEEN stages. The store-side phase of that is
      # owner-gated (percentages live in the Play Console / App Store Connect and neither account
      # exists), but the OTA phase is not — `eas channel:rollout` splits a channel's traffic
      # between the current branch and a candidate one.
      #
      # ⚠️ THE MONITORING BETWEEN STAGES IS THE POINT, NOT THE PERCENTAGES. Advancing on a timer
      # is not a staged rollout, it is a slow deploy. What each stage buys is a bounded population
      # to observe: NFR-06 crash-free sessions and NFR-07 crash-free users are live and were each
      # proven to reach a human (B4.4). Do not advance while an alert is open — and note that an
      # OPEN Sentry issue SUPPRESSES the next alert of its kind, so "no new alert" is not evidence
      # of health if one is already open.
      #
      # ⚠️ AUTO-ROLLBACK IS NOT AUTOMATED, AND CALLING IT SO WOULD BE THE LIE THIS MILESTONE KEEPS
      # FINDING. The ACTION exists and is one dispatch away (`rollout-end` with `revert`), but
      # nothing triggers it: that needs a Sentry alert webhook plus a credential to call GitHub,
      # which is an owner action. A `repository_dispatch` receiver is deliberately NOT added here —
      # a trigger with no sender is the placeholder shape B1 spent its time removing.
      # ---------------------------------------------------------------------------------
      - name: Start a staged rollout
        if: inputs.action == 'rollout-start'
        run: |
          BRANCH="${{ inputs.branch }}"
          if [ -z "$BRANCH" ]; then
            echo "::error::rollout-start needs a candidate branch to roll out TO. Publish the candidate with action=publish and a branch first — rolling a channel out to the branch it already points at splits nothing."
            exit 1
          fi
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} channel:rollout "${{ inputs.channel }}" \
            --action create --branch "$BRANCH" --percent "${{ inputs.percent }}" --non-interactive
          {
            echo "### Staged rollout started → ${{ inputs.channel }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Candidate branch | \`${BRANCH}\` |"
            echo "| Percent on candidate | **${{ inputs.percent }}%** |"
            echo ""
            echo "> **Do not advance on a timer.** Watch NFR-06 (crash-free sessions) and NFR-07"
            echo "> (crash-free users) for this release before the next stage. An OPEN Sentry issue"
            echo "> suppresses the next alert of its kind — silence is not health if one is open."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Advance the rollout
        if: inputs.action == 'rollout-advance'
        run: |
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} channel:rollout "${{ inputs.channel }}" \
            --action edit --percent "${{ inputs.percent }}" --non-interactive
          echo "### Rollout advanced → ${{ inputs.percent }}% on ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # `revert` is the crash-spike action: it abandons the candidate and returns every user to the
      # branch they were on. `republish-and-revert` is the SUCCESS path — it keeps the candidate by
      # republishing it onto the original branch first. The default is `revert`, because the
      # dangerous default is the one that keeps a bad update live.
      - name: End the rollout
        if: inputs.action == 'rollout-end'
        run: |
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} channel:rollout "${{ inputs.channel }}" \
            --action end --outcome "${{ inputs.rollout_outcome }}" --non-interactive
          {
            echo "### Rollout ended → ${{ inputs.channel }} (\`${{ inputs.rollout_outcome }}\`)"
            echo ""
            if [ "${{ inputs.rollout_outcome }}" = "revert" ]; then
              echo "> Candidate abandoned; all users returned to the previous branch. Verify the"
              echo "> metric that detected the problem recovers, then hold a blameless postmortem (§3.4)."
            else
              echo "> Candidate kept and republished onto the original branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: View the rollout
        if: inputs.action == 'rollout-view'
        run: |
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} channel:rollout "${{ inputs.channel }}" \
            --action view --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Roll back
        if: inputs.action == 'rollback'
        run: |
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} update:rollback "${{ steps.resolve.outputs.group }}" \
            --message "Rollback of ${{ steps.resolve.outputs.group }} via ${GITHUB_WORKFLOW}#${GITHUB_RUN_NUMBER}" \
            --non-interactive
          {
            echo "### OTA rollback → ${{ inputs.channel }}"
            echo ""
            echo "Rolled back branch \`${{ steps.resolve.outputs.branch }}\`, group \`${{ steps.resolve.outputs.group }}\`."
            echo ""
            echo "> Verify metrics recover before closing the incident, then hold a blameless postmortem (TDD §3.4)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
