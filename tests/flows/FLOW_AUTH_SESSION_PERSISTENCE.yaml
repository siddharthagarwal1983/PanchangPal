# FLOW_AUTH_SESSION_PERSISTENCE — does the user's IDENTITY survive a process restart?
#
# This is a different question from FLOW_SESSION_PERSISTENCE, which asks whether the RITUAL
# session survives. That one passes on MMKV alone: the ritual session is device-local and keyed
# independently of the user, so it survives even when the account behind it does not.
#
# THE DEFECT THIS EXISTS FOR (found in the B6 OWASP review). `supabaseClient.ts` asked for
# `persistSession: true` and passed NO `storage` adapter. React Native has no `localStorage`, so
# auth-js falls back to an in-memory store — the flag asked for persistence and got memory.
# Because the app is anon-first, the consequence was not a lost login but a lost IDENTITY:
# `restore()` returned null on every cold start and `session.ts` minted a FRESH anonymous uid,
# orphaning the previous user's profile, household, streak, completions, personal dates and
# conversations. Every restart, silently.
#
# WHY NO EXISTING FLOW CAUGHT IT. FLOW_RETURNING relaunches with clearState:false and asserts
# "Light the lamp" — SEEDED content, which a brand-new anonymous user sees identically. Every
# assertion in the suite was satisfiable by a stranger.
#
# WHY THE TRADITION PREFERENCE IS THE PROBE. Nothing on screen renders the uid, so the identity
# has to be observed through something only that identity can read back. `user_profile` is
# upserted by `user_id` under owner-RLS (profileRepository.updatePreferences) and read back the
# same way. Default is 'generic' (domain/profile/types.ts), so 'bengali' is unambiguous:
#   - identity survived  → same uid → the row is found  → Bengali still selected
#   - identity lost      → new uid  → no row → defaults → reverts to Generic, and this fails
#
# ⚠️ THIS HEADER USED TO SAY "the TanStack query cache is NOT persisted, so after a restart the
# value on screen can only have come from the server". THAT PREMISE IS FALSE and has been since
# PR #66: `queryPersistence.ts` writes `preferences` to disk. The CONCLUSION still holds, but for
# a different reason — the cache key is `['preferences', userId]`, so a newly minted uid cannot
# read the previous identity's cached entry and falls through to the server exactly as before.
# The probe survives on uid-scoping, not on absence of persistence. Anyone widening that key, or
# dropping the uid from it, breaks this flow's ability to detect the defect it exists for.
#
# THE SECOND WAY THIS COULD HAVE GONE FALSE-GREEN (closed 2026-08-01). `preferences` is now a
# durably queued sync kind, so the change survives an app kill in STORE_offlineQueue. A drain that
# ignored identity would then RECREATE Bengali under the new uid — the flow would pass at the
# exact moment identity was lost. `isSendableBy` prevents it: a queued mutation carries the uid
# that made it and is HELD, never applied, under any other. Guarded by
# `domain/sync/__tests__/identityScope.test.ts`.
#
# SELECTORS ARE testIDs, NOT TEXT — see FLOW_MORNING_RITUAL for why text matching silently
# passes while navigating nowhere.
appId: com.panchangpal.app
---
# THREE DISCRETE STEPS, not `launchApp: clearState: true` — see FLOW_OFFLINE_SYNC for the full
# diagnosis. Fusing the clear and the launch races the previous flow's TASK teardown: Android's
# `Destroy timeout of remove-task` fires ~1.1s into the launch and kills the process it has just
# created. `stopApp` alone does NOT fix it; what lingers is the task, not the process.
#
# THIS FLOW DREW IT ON 2026-07-28 (run 30294996523, attempt 1) and it was the most expensive place
# in the suite for it to happen. The launch was disturbed 130ms in —
# `Destroy timeout of remove-task, attempt to kill Task{...#13}` — and the flow went on to fail its
# final assertion with the tradition reverted to Generic. That is IDENTICAL to the signature of the
# identity-loss defect this flow exists to catch, so a harness race presented as the one product
# defect nobody may dismiss. The same commit passed 6/6 on re-run, which is how it was identified as
# a race rather than a regression in the `@supabase/auth-js` bump that had landed hours earlier.
#
# A false red costs what a false green costs, and this flow's false red costs more than most.
- stopApp
- clearState

- launchApp

# Pass the onboarding gate if showing. A CI emulator has no stored state, so a fresh device
# correctly opens SCR_AUTH_001 (PR #50). Conditional, so it is a no-op after the first pass.
- runFlow:
    when:
      visible: 'Skip for now'
    commands:
      - tapOn:
          id: 'auth-skip'

- extendedWaitUntil:
    visible: "Today's ritual"
    timeout: 60000

# Establish something only THIS user can read back. The upsert is server-authoritative; the
# optimistic mirror is discarded with the process, which is the point.
- tapOn:
    id: 'tab-you'
- tapOn:
    id: 'you-settings-entry'
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'settings-tradition-bengali'
- assertVisible:
    id: 'settings-tradition-bengali'
    selected: true
- takeScreenshot: auth-session-01-preference-set

# Kill the process. Anything held only in memory — the auth session when no storage adapter is
# configured, STORE_prefs, the query cache — is gone. Only what SecureStore wrote survives.
- stopApp

- launchApp:
    clearState: false

# The gate must NOT reappear (the onboarding flag is MMKV-persisted, PR #50). Asserting its
# absence here would duplicate FLOW_ONBOARDING, so this stays conditional and tolerant: this
# flow is about identity, and a gate regression should fail the flow that owns it.
- runFlow:
    when:
      visible: 'Skip for now'
    commands:
      - tapOn:
          id: 'auth-skip'

- extendedWaitUntil:
    visible: "Today's ritual"
    timeout: 60000

- tapOn:
    id: 'tab-you'
- tapOn:
    id: 'you-settings-entry'
- assertVisible:
    id: 'settings-screen'
- takeScreenshot: auth-session-02-after-restart

# THE ASSERTION. Bengali still selected means the session was restored from SecureStore and the
# same uid read back its own profile row. A revert to Generic means a new anonymous user was
# minted and the previous one's data is now unreachable.
#
# If this fails, `adb logcat` from the same run (captured by e2e.yml) separates the causes: the
# '[auth-storage] SecureStore unavailable' warning means the keystore degraded to memory; its
# absence means SecureStore was active and the persist/restore path itself is at fault.
# `extendedWaitUntil`, not a bare `assertVisible`, and the distinction is not cosmetic.
#
# The tradition now reaches the server by TWO paths: the direct write, and — if that lost the race
# to the kill — the durable queue draining after this relaunch (§6.4). The drain is asynchronous
# with jittered backoff, so the correct assertion is about the END STATE, not its timing. That is
# the same reasoning FLOW_OFFLINE_SYNC's post-drain assertion already uses.
#
# THIS IS NOT SETTLE TIME HIDING A RACE. The race it used to hide is gone: before 2026-08-01 a
# preference had no durable path at all, so this assertion was reading whether an in-flight HTTP
# request happened to beat `stopApp` — and when it did not, the revert to Generic was
# indistinguishable from identity loss and was misattributed three times (twice to a launch race,
# once to a Sentry regression). The wait below cannot mask identity loss, because a mutation made
# under the old uid is HELD rather than applied under a new one.
- extendedWaitUntil:
    visible:
      id: 'settings-tradition-bengali'
      selected: true
    timeout: 60000

- clearState
