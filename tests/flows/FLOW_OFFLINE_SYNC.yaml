# FLOW_OFFLINE_SYNC — does an offline mutation survive an app kill, and reconcile on reconnect?
#
# This is the flow the offline-sync work (PR #66) shipped WITHOUT, and said so. Its absence was
# recorded as the residual risk in the same breath as the feature: "it has never run against a live
# backend, and there is no FLOW_OFFLINE_SYNC — the class of gap a real flow caught for MMKV and unit
# tests structurally cannot."
#
# That sentence is not rhetorical. The MMKV defect is the precedent: 350 unit tests passed while
# ritual sessions silently never persisted, because every test ran against a working fake and the
# real device store had degraded to memory. The offline queue has exactly the same shape — a
# `KeyValueStore` seam, a fallback that is deliberately silent, and unit tests that exercise the
# seam rather than the device. Only a process kill on real hardware can tell them apart.
#
# WHAT THIS FLOW PROVES, and it is three separate things that unit tests cover individually and
# never together:
#   1. STORE_offlineQueue is written to DISK — a mutation made offline is still pending after the
#      OS reclaims the process. (Before PR #66 this was an in-memory zustand slice beneath a header
#      claiming MMKV persistence.)
#   2. The §6.1 persisted query cache is real — a cold start with no network still RENDERS the
#      daily loop rather than an empty screen. §6.2 marks that `[MANDATORY]`.
#   3. The completion is not reverted when the drain runs. Reconciliation treats anything the
#      server acknowledges as applied; a bug there would show up as the tick disappearing after
#      reconnect, which is worse than never having synced at all.
#
# WHY THE CHECKLIST AND NOT THE RITUAL. The checklist is the only daily-loop surface whose state is
# BOTH server-backed (so the persisted query cache is genuinely exercised) and visibly rendered as a
# per-item state. The ritual's completion is held in the ritual session store — a different seam,
# already covered by FLOW_SESSION_PERSISTENCE — and Today's own ritual card passes
# `completedToday: false` as a literal, so it cannot witness anything.
#
# THE SELECTOR IS THE GLYPH, and that is a deliberate exception to this suite's testID rule.
# Checklist.tsx renders '☑' when complete and '☐' when not; the row's testID is
# `checklist-item-<uuid>`, and the uuid is generated by the seed, so it is not knowable from here.
# The glyph is the only stable, rendered signal of the state under test. It is asserted alongside
# the item's label so a passing run cannot be some other row's tick.
#
# AIRPLANE MODE, NOT A KILLED SERVER. `setAirplaneMode` reproduces what a user actually does — a
# tunnel, a flight, a dead zone — and exercises the NetInfo path the app really listens to. It
# requires Maestro >= 1.37; the pinned CI install is 2.x, and an older binary fails loudly at the
# command rather than skipping it.
appId: com.panchangpal.app
---
# THREE DISCRETE STEPS, and the first two runs of this flow paid for that shape.
#
# `launchApp: clearState: true` fuses the clear and the launch, and on this emulator the stale task
# from the previous flow is still being destroyed when the new process starts. Android then kills
# the process it has just created:
#
#   10:28:00.191  Force stopping ...: clear data                    <- the clear
#   10:28:01.089  Force stopping ...: from pid 2738                 <- the launch
#   10:28:01.320  Destroy timeout of remove-task, kill Task{#8}     <- the OLD task, 1.1s later
#   10:28:01.321  Killing 2747 (adj -10000): remove task            <- the NEW process
#   10:28:11.185  Process ...2747... failed to attach
#
# The app never starts, the captured hierarchy holds nothing but the status-bar clock, and the flow
# fails 60s later on its first assertion — looking exactly like an offline-sync defect. Adding
# `stopApp` alone did NOT fix it: what lingers is the TASK, not the process, and its destroy-timeout
# is what fires. Separating the clear into its own command lets the teardown finish before the
# launch begins.
#
# This is a suite-wide hazard, not a quirk of this flow: FLOW_MORNING_RITUAL and FLOW_RETURNING both
# end without `stopApp` or `clearState`, so ANY flow opening with a cleared launch can draw it
# depending on the order Maestro picks. The other three happen to follow flows that clean up. Fixed
# locally rather than by editing flows that currently pass.
- stopApp
- clearState

- launchApp

# Same conditional gate as the other flows: a CI emulator has no stored state, so PR #50's real
# onboarding flag correctly opens SCR_AUTH_001 on a fresh device.
- runFlow:
    when:
      visible: 'Skip for now'
    commands:
      - tapOn:
          id: 'auth-skip'

- extendedWaitUntil:
    visible: "Today's ritual"
    timeout: 60000

# ONLINE PRECONDITION. The checklist must have loaded from staging and be UNCHECKED, or every
# assertion below is vacuous — a flow that starts from an already-ticked item proves nothing about
# ticking it. This also populates the query cache that step 2 depends on.
- assertVisible: 'Light the lamp'
- assertVisible: '☐'
- takeScreenshot: offline-sync-01-online-unchecked

# ---- Go offline -------------------------------------------------------------------------------
- setAirplaneMode: enabled

# The banner is the app's own witness that it noticed. If this fails, NetInfo never reported the
# change and everything after it would be testing the online path while claiming otherwise.
- extendedWaitUntil:
    visible: "You're offline — showing saved content."
    timeout: 30000
- takeScreenshot: offline-sync-02-offline-banner

# ---- Mutate while offline ---------------------------------------------------------------------
# Tapping enqueues into STORE_offlineQueue and updates optimistically. The tick appearing here
# proves only the optimistic update; disk persistence is not yet demonstrated.
- tapOn: 'Light the lamp'
- assertVisible: '☑'
- takeScreenshot: offline-sync-03-offline-completed

# ---- The whole question -----------------------------------------------------------------------
# stopApp kills the process. Anything held only in memory is gone: the zustand queue, the in-memory
# KeyValueStore fallback, TanStack Query's cache. What survives is what MMKV actually wrote.
- stopApp

- launchApp:
    clearState: false

# Still offline. A cold start with no network must still render the daily loop from the persisted
# cache — this is §6.2's `[MANDATORY]` cached loop, and before the §6.1 work this screen was empty.
- extendedWaitUntil:
    visible: "Today's ritual"
    timeout: 60000
- assertVisible: 'Light the lamp'

# THE ASSERTION THIS FLOW EXISTS FOR. A '☐' here means the completion was lost on app kill —
# precisely the failure the offline queue was built to prevent, and precisely what a passing unit
# suite would not have told us.
- assertVisible: '☑'
- takeScreenshot: offline-sync-04-survived-restart-offline

# ---- Reconnect and drain ----------------------------------------------------------------------
- setAirplaneMode: disabled

# The banner clearing is the app noticing the network again, which is also what triggers the drain
# (useOfflineSync's reconnect trigger, §6.4).
- extendedWaitUntil:
    notVisible: "You're offline — showing saved content."
    timeout: 60000

# After the drain the item must STILL be ticked. A revert here means reconciliation dropped a
# mutation the server had accepted — the queue would be empty and the user's completion gone, which
# is a worse outcome than never syncing. The wait is generous because the drain is single-flight
# with jittered backoff and this assertion is about the end state, not its timing.
- extendedWaitUntil:
    visible: '☑'
    timeout: 60000
- assertVisible: 'Light the lamp'
- takeScreenshot: offline-sync-05-after-drain

# Leave the device as this flow found it. Airplane mode is already off; clearState stops the ticked
# item and the drained queue from becoming the next flow's hidden precondition — the mistake
# FLOW_SESSION_PERSISTENCE's closing comment warns about.
- clearState
